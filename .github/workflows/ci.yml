name: Gate Job Probe

on:
  push:
    branches: [enact/branding]

permissions:
  contents: read

jobs:
  gate:
    name: CI Required Gate
    if: always()
    needs: [master-debounce, fmt, history-guard, repo-structure, relay-container-smoke-changes, relay-container-smoke, path-changes, lint, build, check, check-plugin-backends, msrv, check-32bit, bench, test, test-channel-features, test-tool-features, test-cli-only, memory-postgres-test, parallel-runtime-test-changes, parallel-runtime-test, test-landlock, security, nix-eval, nix-hash-drift, docs-style, installer-drift, zerocode-rpc-boundary, web-permission-tests, crates-preflight-changes, crates-preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
