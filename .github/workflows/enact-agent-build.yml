name: Enact Agent native build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build committed source and qualify extracted archive
        run: |
          set -euo pipefail
          git remote rename origin enact
          git remote add origin https://github.com/zeroclaw-labs/zeroclaw.git
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          python_bin="$(find "$RUNNER_TOOL_CACHE/Python" -name python3 -path '*/3.12.*/*/bin/python3' | sort | tail -1)"
          test -x "$python_bin"
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 "$cargo_bin" fetch --locked
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          output="$RUNNER_TEMP/enact-release"
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 "$python_bin" -B overlays/enact/build.py release --cargo "$cargo_bin" --rustc "$rustc_bin" --output-dir "$output"
          archives=("$output"/*.tar.gz)
          test "${#archives[@]}" -eq 1
          mkdir "$RUNNER_TEMP/enact-extracted"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/enact-extracted"
          payload="$(find "$RUNNER_TEMP/enact-extracted" -type f -name enact-agent)"
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 "$python_bin" -B overlays/enact/probe_native.py --binary "$payload"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enact-agent-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/enact-release/*.tar.gz
            ${{ runner.temp }}/enact-release/SHA256SUMS
          if-no-files-found: error
