name: Enact Agent native build
on:
  # The native release build runs on every push to the integration branch, so
  # a change that breaks the build is caught here rather than at the next
  # manual dispatch. The manual trigger stays for a deliberate rebuild.
  push:
    branches: [enact/branding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    # Shared Azure Blob cache writes require the protected integration branch.
    if: github.ref == 'refs/heads/enact/branding' && github.ref_protected
    runs-on: ${{ matrix.os }}
    # The native release build is a full workspace compile plus a component
    # probe. It takes ~20 minutes on a Linux runner but 45-80 minutes on the
    # macOS runners, which are often oversubscribed, so 120 minutes left very
    # little headroom for a slower runner before a working build was killed.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15]
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_SERVER_UDS: ${{ runner.temp }}/enact-agent-sccache.sock
      SCCACHE_IDLE_TIMEOUT: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Enable isolated Azure Blob cache server
        env:
          SCCACHE_AZURE_CONNECTION_STRING: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
          SCCACHE_AZURE_BLOB_CONTAINER: ${{ vars.SCCACHE_AZURE_BLOB_CONTAINER }}
          SCCACHE_AZURE_KEY_PREFIX: ${{ vars.SCCACHE_AZURE_KEY_PREFIX }}
        run: |
          set -euo pipefail
          if [[ -z "${SCCACHE_AZURE_CONNECTION_STRING:-}" || -z "${SCCACHE_AZURE_BLOB_CONTAINER:-}" ]]; then
            echo "Shared sccache requires SCCACHE_AZURE_CONNECTION_STRING secret and SCCACHE_AZURE_BLOB_CONTAINER repository variable." >&2
            exit 1
          fi
          test -x "$SCCACHE_PATH"
          sccache --start-server
          sccache --zero-stats
          "$SCCACHE_PATH" --show-stats --stats-format json > "$RUNNER_TEMP/enact-sccache-start.json"
          python3 - "$RUNNER_TEMP/enact-sccache-start.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          info = json.loads(Path(sys.argv[1]).read_text())
          location = info.get("cache_location", "")
          if not location.startswith("azblob"):
              raise SystemExit(f"Expected Azure Blob sccache backend, got {location!r}")
          print("Azure Blob sccache backend selected")
          PY
          {
            printf 'ENACT_AGENT_USE_SCCACHE=1\n'
            printf 'RUSTC_WRAPPER=%s\n' "$SCCACHE_PATH"
          } >> "$GITHUB_ENV"
      - name: Build committed source and qualify extracted archive
        run: |
          set -euo pipefail
          git remote rename origin enact
          git remote add origin https://github.com/zeroclaw-labs/zeroclaw.git
          python_bin="$(command -v python)"
          test -x "$python_bin"
          msrv="$("$python_bin" -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["rust-version"])')"
          [[ "$msrv" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$msrv" --profile minimal --component rustfmt
          rustup default "$msrv"
          cargo_bin="$(rustup which cargo)"
          rustc_bin="$(rustup which rustc)"
          printf 'Python executable: %s\n' "$python_bin"
          "$python_bin" --version
          "$cargo_bin" --version
          "$rustc_bin" --version
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 "$cargo_bin" fetch --locked
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          output="$RUNNER_TEMP/enact-release"
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 \
            ENACT_AGENT_USE_SCCACHE="$ENACT_AGENT_USE_SCCACHE" \
            RUSTC_WRAPPER="$RUSTC_WRAPPER" CARGO_INCREMENTAL=0 \
            SCCACHE_BASEDIRS="$SCCACHE_BASEDIRS" SCCACHE_SERVER_UDS="$SCCACHE_SERVER_UDS" SCCACHE_IDLE_TIMEOUT=0 \
            "$python_bin" -B overlays/enact/build.py release --cargo "$cargo_bin" --rustc "$rustc_bin" --output-dir "$output"
          archives=("$output"/*.tar.gz)
          test "${#archives[@]}" -eq 1
          mkdir "$RUNNER_TEMP/enact-extracted"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/enact-extracted"
          payload="$(find "$RUNNER_TEMP/enact-extracted" -type f -name enact-agent)"
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 "$python_bin" -B overlays/enact/probe_native.py --binary "$payload"
          "$SCCACHE_PATH" --show-stats --stats-format json > "$RUNNER_TEMP/enact-sccache-final.json"
          python3 - "$RUNNER_TEMP/enact-sccache-final.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          info = json.loads(Path(sys.argv[1]).read_text())
          stats = info["stats"]
          errors = stats["cache_errors"]["counts"]
          failed_reads = stats["cache_read_errors"]
          failed_writes = stats["cache_write_errors"]
          timeouts = stats["cache_timeouts"]
          if not info["cache_location"].startswith("azblob"):
              raise SystemExit("sccache stopped using the Azure Blob backend")
          if sum(errors.values()) or failed_reads or failed_writes or timeouts:
              raise SystemExit(
                  f"Azure Blob sccache errors: cache={sum(errors.values())}, "
                  f"read={failed_reads}, write={failed_writes}, timeouts={timeouts}"
              )
          print(
              f"Azure Blob sccache: hits={sum(stats['cache_hits']['counts'].values())}, "
              f"writes={stats['cache_writes']}, errors=0"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enact-agent-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/enact-release/*.tar.gz
            ${{ runner.temp }}/enact-release/SHA256SUMS
          if-no-files-found: error

  contract:
    # The tool contract is what a host reads to learn the fork's vocabulary.
    # It is generated from the family table, so it cannot drift from the
    # registry — but only if a stale copy cannot be committed. This job
    # regenerates it and fails when the committed file differs.
    if: github.ref == 'refs/heads/enact/branding'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: The committed tool contract is current
        run: python3 overlays/enact/contract/generate_contract.py --check
      - name: The committed operations inventory is current
        run: python3 overlays/enact/contract/generate_operations_csv.py --check
