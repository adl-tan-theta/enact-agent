# cargo-deny configuration -- v2 schema
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# In v2, vulnerability advisories always emit errors (not configurable).
# unmaintained: scope of unmaintained-crate checks (all | workspace | transitive | none)
unmaintained = "all"
# yanked: deny | warn | allow
#
# The fork warns rather than denies. A yanked version in the graph is
# upstream's own pin -- the fork's `Cargo.lock` is upstream's bytes -- and a
# yanked version cannot be waived by id, because the advisory has none.
# Denying it would fail the gate on a decision the fork cannot make without
# editing a stock lockfile.
yanked = "warn"
# Advisories we cannot act on from this repository: unmaintained transitive
# deps we cannot easily replace, and vulnerabilities whose fix is published
# but unreachable because an intermediate crate pins the vulnerable version.
ignore = [
    # rustls-pemfile -- unmaintained, functionality moved to rustls-pki-types;
    # transitive dep, upstream migration tracked
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive dep awaiting upstream migration to rustls-pki-types" },
    { id = "RUSTSEC-2026-0319", reason = "anymap2 unmaintained; matrix-sdk 0.19.1 still depends on it with no replacement release; remove after upstream migration, tracked in #11429" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; async-imap 0.11.3 (and 0.12.0) still depend on it with no release without it; remove after upstream migration, tracked in #12252" },
    # libsqlite3-sys -- the bundled SQLite 3.53.2 can return uninitialized
    # page-cache memory when a database is opened together with a crafted
    # sibling -wal file (CVE-2026-119375; local, needs both files). Fixed in
    # 0.39 (SQLite 3.54), which needs rusqlite 0.41. matrix-sdk-sqlite 0.19.1,
    # the newest, requires rusqlite 0.40.2, and libsqlite3-sys is a `links`
    # crate, so the lockfile cannot carry the fix yet. Drop this entry in the
    # rusqlite 0.41 bump; #12320 tracks it.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.38.2 bundles SQLite 3.53.2 (CVE-2026-119375, local, needs a crafted db and -wal pair); the 0.39 fix needs rusqlite 0.41, unreachable while matrix-sdk-sqlite 0.19.1 requires rusqlite 0.40.2; #12320" },
    # ── The fork's upstream-owned pins ────────────────────────────────────
    #
    # Every advisory below is a consequence of a version pin that upstream
    # owns. The fork's `Cargo.toml` and `Cargo.lock` are upstream's bytes, so
    # the fork inherits the pins and inherits the advisories. Upstream has
    # not shipped the fixes yet.
    #
    # The fork therefore carries its own policy file and runs
    # `cargo deny --config overlays/enact/deny.toml check`. The tracked
    # `deny.toml` stays upstream's, so an upstream bump removes the need for
    # these waivers without the fork having to touch a stock file.
    #
    # Drop each entry when upstream ships the fix.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no patched release; upstream's own direct dependency of 11 workspace crates; the fork inherits upstream's pin and cannot move it without editing a stock Cargo.toml" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained with no patched release; upstream's own dependency, used only by zeroclaw-runtime; the fork inherits upstream's pin" },
    { id = "RUSTSEC-2026-0548", reason = "zip 9.0.3 is pinned by upstream's Cargo.toml; 9.0.5 adds the header-consistency check, but the pin is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0560", reason = "lettre 0.11.22 is pinned by upstream's Cargo.lock; 0.11.24 fixes the STARTTLS response-injection advisory, but the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0561", reason = "lettre 0.11.22 is pinned by upstream's Cargo.lock; 0.11.24 fixes the SMTP command-injection advisory, but the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0562", reason = "lettre 0.11.22 is pinned by upstream's Cargo.lock; 0.11.24 fixes the display-name panic advisory, but the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0563", reason = "lettre 0.11.22 is pinned by upstream's Cargo.lock; 0.11.24 fixes the EHLO reply advisory, but the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0564", reason = "lettre 0.11.22 is pinned by upstream's Cargo.lock; 0.11.24 fixes the STARTTLS response-injection advisory, but the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0565", reason = "lettre 0.11.22 is pinned by upstream's Cargo.lock; 0.11.24 fixes the unbounded SMTP reply advisory, but the lock is a stock file the fork does not touch" },
    # ── Advisories published after the pinned upstream base ──────────────
    #
    # Every one of these is a consequence of an upstream-owned pin, and every
    # one was published after the base this fork is pinned to. Upstream's own
    # policy file does not waive them yet, so the fork's policy file does.
    # They are listed here rather than in the tracked `deny.toml` because
    # that file is upstream's bytes.
    #
    # Drop each entry when upstream waives it or moves the pin.
    { id = "RUSTSEC-2026-0566", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0567", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0568", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0569", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0570", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0571", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0572", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0573", reason = "wasmtime 48.0.8 is pinned by upstream's Cargo.lock; the fix is a newer wasmtime, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0574", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0575", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0576", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0577", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0578", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0579", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0580", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0581", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0582", reason = "heapless 0.9.3 is pinned by upstream's Cargo.lock; the fix is a newer heapless, and the lock is a stock file the fork does not touch" },
    { id = "RUSTSEC-2026-0243", reason = "nostr-relay-pool 0.44.3 is unmaintained; upstream's own dependency, and the fix is upstream's to make" },
    { id = "RUSTSEC-2024-0370", reason = "zbus_names 1.0.4 is unmaintained; upstream's own transitive dependency, and the fix is upstream's to make" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant_derive 5.12.0 is unmaintained; upstream's own transitive dependency, and the fix is upstream's to make" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant 5.12.0 is unmaintained; upstream's own transitive dependency, and the fix is upstream's to make" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant 5.12.0 is unmaintained; upstream's own transitive dependency, and the fix is upstream's to make" },
]

[licenses]
# All licenses are denied unless explicitly allowed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
unused-allowed-license = "allow"

[bans]
# Reject multiple versions of the same crate in the resolved dependency graph.
# This prevents silent version splits that inflate compile times, binary size,
# and the advisory surface. Existing duplicates are explicitly skipped below;
# remove skips as dependency bumps resolve them.
multiple-versions = "deny"
wildcards = "deny"
deny = [
    # The lru exception upstream carries names `nostr-database` and
    # `nostr-relay-pool` as the wrappers that pull the vulnerable version.
    # Neither crate is in the graph any more: `lru 0.18.4` is now a direct
    # dependency of the workspace crates, and it is above the `0.18.2`
    # threshold the exception was written for. The ban therefore never
    # fires, and cargo-deny reports both wrappers as unused on every run.
    # Dropping the entry removes that noise. The advisory itself,
    # RUSTSEC-2026-0253, needs no waiver: the graph does not carry the
    # affected version.
]

# Pre-existing duplicate-version crates as of 2026-07-01.
# Each skip entry removes one specific duplicate version from the
# multiple-versions check. The canonical (unskipped) version is the
# newest one currently in the resolved graph; remove skip entries as
# dependency bumps eliminate the older duplicates. Version-scoping
# ensures that any future unlisted duplicate version fails CI.

[[bans.skip]]
name = "async-channel"
version = "=1.9.0"

[[bans.skip]]
name = "bitflags"
version = "=1.3.2"


# The four entries below arrived with the matrix-sdk 0.19 bump: vodozemac
# 0.11 pulls the RustCrypto 0.12 generation (aead 0.6, chacha20poly1305
# 0.11, cipher 0.5, digest 0.11), while zeroclaw-config still encrypts with
# chacha20poly1305 0.10 on the older generation. Same split as the existing
# `chacha20 =0.9.1` skip. They go away when this repository's own crypto
# deps move to the newer generation.

[[bans.skip]]
name = "block-buffer"
version = "=0.10.4"

[[bans.skip]]
